backend:
  name: git-gateway
  branch: main

publish_mode: editorial_workflow

media_folder: "src/assets/images"
public_folder: "/assets/images"

collections:
  - name: "insights"
    label: "Insights"
    folder: "src/insights/entries"
    create: true
    slug: "{{slug}}"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - label: "Type"
        name: "type"
        widget: "select"
        options: ["white-paper", "announcement", "project-note"]
        default: "project-note"
        hint: "Not shown on the site yet — used later if the hub gets filters/sections."
      - { label: "Summary (150–250 words, shown on hub + link previews)", name: "summary", widget: "text" }
      - { label: "Meta Description Override (optional, defaults to Summary)", name: "description", widget: "text", required: false }
      - { label: "Preview Image (for link previews — LinkedIn, etc.)", name: "image", widget: "image", required: false }
      - { label: "PDF (for white papers)", name: "pdf", widget: "file", required: false, media_folder: "/src/assets/documents", public_folder: "/assets/documents" }
      - { label: "Read Time / Page Count (e.g. \"8 min read\" or \"12 pages\")", name: "readTime", widget: "string", required: false }
      - label: "Key Findings (white papers only — 3–4 bullet points)"
        name: "keyFindings"
        widget: "list"
        required: false
        field: { label: "Finding", name: "finding", widget: "string" }
      - { label: "Bottom CTA Text (optional, defaults to a standard prompt)", name: "ctaText", widget: "string", required: false }
      - { label: "Bottom CTA Link (optional, defaults to Contact)", name: "ctaLink", widget: "string", required: false }
      - { label: "Body", name: "body", widget: "markdown", required: false }

  - name: "settings"
    label: "Site Content"
    files:
      - name: "content"
        label: "Edit Website Content"
        file: "src/_data/site.json"
        fields:
          # ── Analytics ──
          - label: "Analytics"
            name: "analytics"
            widget: "object"
            collapsed: true
            fields:
              - label: "Google Analytics Measurement ID"
                name: "ga4_id"
                widget: "string"
                required: false
                hint: "Looks like G-XXXXXXXXXX. Get it from analytics.google.com under Admin → Data Streams. Leave blank to turn analytics off entirely."

          # ── Meta / SEO ──
          - label: "SEO & Meta"
            name: "meta"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Page Title", name: "title", widget: "string" }
              - { label: "Meta Description", name: "description", widget: "text" }
              - { label: "Social Share Description", name: "og_description", widget: "text" }

          # ── Hero Section ──
          - label: "Hero Section"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Tagline", name: "tagline", widget: "string" }
              - { label: "Subtitle (Paragraph 1)", name: "subtitle", widget: "text" }
              - { label: "Subtitle (Paragraph 2)", name: "subtitle2", widget: "text" }
              - { label: "Quote", name: "quote", widget: "text" }
              - { label: "Button Text", name: "cta", widget: "string" }

          # ── About Section ──
          - label: "About Section"
            name: "about"
            widget: "object"
            fields:
              - { label: "Section Label", name: "label", widget: "string" }
              - { label: "Heading (Your Name)", name: "heading", widget: "string" }
              - { label: "Headshot Photo", name: "headshot", widget: "image" }
              - label: "Bio Paragraphs"
                name: "paragraphs"
                widget: "list"
                field: { label: "Paragraph", name: "paragraph", widget: "text" }
              - { label: "Quote", name: "quote", widget: "text" }

          # ── Services Section ──
          - label: "Services Section"
            name: "services"
            widget: "object"
            fields:
              - { label: "Section Label", name: "label", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Quote", name: "quote", widget: "text" }
              - label: "Service Items"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Description", name: "description", widget: "text" }

          # ── Client Focus Areas ──
          - label: "Client Focus Areas"
            name: "clients"
            widget: "object"
            fields:
              - { label: "Section Label", name: "label", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Quote", name: "quote", widget: "text" }
              - label: "Client Areas"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Description", name: "description", widget: "text" }

          # ── Community & Civic Leadership ──
          - label: "Community & Civic Leadership"
            name: "community"
            widget: "object"
            fields:
              - { label: "Section Label", name: "label", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Quote", name: "quote", widget: "text" }
              - label: "Civic Areas"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Description", name: "description", widget: "text" }

          # ── Why Nasc Consulting ──
          - label: "Why Nasc Consulting"
            name: "whyNasc"
            widget: "object"
            fields:
              - { label: "Section Label", name: "label", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - label: "Items"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Description", name: "description", widget: "text" }

          # ── Contact Section ──
          - label: "Contact Section"
            name: "contact"
            widget: "object"
            fields:
              - { label: "Section Label", name: "label", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Quote", name: "quote", widget: "text" }
              - { label: "Subtext", name: "subtext", widget: "text" }
              - { label: "Phone Number", name: "phone", widget: "string" }
              - { label: "Email Address", name: "email", widget: "string" }
              - { label: "Location", name: "location", widget: "string" }
              - { label: "Formspree Form ID", name: "form_id", widget: "string", hint: "Get this from formspree.io" }
              - { label: "Success Message", name: "success_message", widget: "string" }
              - { label: "Error Message", name: "error_message", widget: "string" }

          # ── Footer ──
          - label: "Footer"
            name: "footer"
            widget: "object"
            fields:
              - { label: "Tagline", name: "tagline", widget: "string" }
              - { label: "Copyright Year", name: "year", widget: "string" }
              - { label: "Location", name: "location", widget: "string" }
